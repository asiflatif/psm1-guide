  }
  else if (p.examIn < 0) todayBlock = `<div class="today-head"><h2>Your exam date has passed</h2></div><p class="muted">How did it go? Mark the plan completed, or pick a new exam date below to keep studying.</p><div class="choices"><button class="btn primary" data-act="complete">Mark plan completed</button></div>`;
  else if (p.remainingMin === 0) todayBlock = `<div class="today-head"><h2>All lessons done 🌿</h2></div><p class="muted">Keep sharp with practice exams until you score 95% or more consistently, then take the Scrum Open assessment.</p><div class="choices"><a class="btn primary" href="#practice">Take a practice exam</a></div>`;
  else {
    const doneMinToday = p.list.filter(l => S.done[l.id]).reduce((s,l) => s + l.min, 0);
    const met = doneMinToday >= p.daily;
    todayBlock = `<div class="today-head"><h2>${met ? "Today’s target met" : "Today’s reading"}</h2><div class="target"><span data-count="${p.daily}">${p.daily}</span><small>min</small></div></div>
    <p class="muted">${met ? "Nice work. Reading ahead lowers tomorrow’s target." : `${p.remainingMin} minutes left across ${p.daysLeft} study ${p.daysLeft === 1 ? "day" : "days"}, finishing ${nice(p.studyEnd)}.`}</p>
    <div class="bar" style="margin-top:12px"><span style="width:${Math.min(100, Math.round(doneMinToday/p.daily*100))}%"></span></div>
    <ul class="today-list">${p.list.map(l => `<li class="${S.done[l.id] ? "done" : ""}"><a href="#${l.id}"><span class="tick"></span><span>${esc(l.title)}</span><span class="mins">${l.min} min</span></a></li>`).join("")}</ul>`;
  }
  return `${geo("plan")}<div class="title-row"><h1>Study plan</h1><span class="pill ${S.status}"><span class="dot"></span>${STATUS[S.status]}</span></div>
  <p class="lede">Exam on ${long(S.target)}. The plan recalculates every day from what you’ve finished.</p>
  <div class="status-actions">
    ${paused ? `<button class="btn" data-act="resume">Resume plan</button>` : `<button class="btn" data-act="pause">Pause plan</button>`}
    <button class="btn" data-act="complete">Mark completed</button>
    <button class="btn danger" data-act="cancel">Cancel exam</button>
  </div>
  <div class="panel today">${todayBlock}</div>
  ${statsBlock(p, doneCount, best, st)}
  <div class="panel"><h2>Your study burndown</h2><p class="muted">The same chart Scrum teams use for a Sprint: the dashed line is the ideal pace, the solid line is your progress.${S.pauses.length ? " Shaded days were paused." : ""}</p>
    <div class="chart-wrap">${burndown()}</div>
    <div class="legend"><span><i style="background:var(--sage)"></i>Actual</span><span><i style="background:var(--faint)"></i>Ideal</span>${S.pauses.length ? `<span><i style="background:var(--amber-mist);height:10px"></i>Paused</span>` : ""}</div></div>
  <div class="panel"><h2>Dates</h2>
    <div class="row" style="margin-top:12px"><label class="field">Study started<input type="date" id="setStart" value="${S.start}" max="${S.target}"></label><label class="field">Exam date<input type="date" id="setTarget2" value="${S.target}" min="${S.start}"></label><button class="btn" id="saveDates">Save dates</button></div></div>
  ${pastPlans()}
  <div class="panel"><h2>Your progress data</h2><p class="muted">Progress is saved in this browser only. Export it to back it up or move it to another device.</p>
    <div class="choices"><button class="btn" id="exportBtn">Export progress</button><label class="btn" for="importFile">Import progress</label><input type="file" id="importFile" accept="application/json" hidden><button class="btn quiet" id="resetBtn">Reset everything</button></div>
    ${storageOk ? "" : `<p class="notice">This browser is blocking local storage, so progress won’t be kept after you close the page. Use Export progress before leaving.</p>`}</div>`;
}

function qBlock(q, key, idx){
  const multi = q.a.length > 1;
  return `<div class="q" data-key="${key}" data-i="${idx}"><p class="stem">${esc(q.q)}</p>${multi ? `<p class="hint">Choose ${q.a.length}.</p>` : ""}
  ${q.o.map((o,i) => `<label class="opt"><input type="${multi ? "checkbox" : "radio"}" name="${key}-${idx}" value="${i}"><span>${esc(o)}</span></label>`).join("")}
  <div class="explain-slot"></div></div>`;
}
function grade(q, picked){ return [...q.a].sort().join() === [...picked].sort().join(); }

function viewLesson(id){
  const l = LESSONS.find(x => x.id === id);
  const i = LESSONS.indexOf(l), prev = LESSONS[i-1], next = LESSONS[i+1];
  const done = !!S.done[l.id];
  return `<div class="crumb">${esc(l.module.title)}</div>
  <h1>${esc(l.title)}</h1>
  <div class="meta"><span class="chip">${l.min} min</span><span class="chip">${esc(l.module.area)}</span>${done ? `<span class="chip ok">Done ${nice(S.done[l.id])}</span>` : ""}</div>
  <div class="reading">${l.body}</div>
  ${l.keys.length ? `<div class="aside"><h3>Remember</h3><ul>${l.keys.map(k => `<li>${esc(k)}</li>`).join("")}</ul></div>` : ""}
  ${l.traps.length ? `<div class="aside trap"><h3>Exam traps</h3><ul>${l.traps.map(k => `<li>${esc(k)}</li>`).join("")}</ul></div>` : ""}
  ${l.qs.length ? `<section class="qs"><h2>Quick check</h2>${S.quiz[l.id] !== undefined ? `<p class="muted">Last score: ${S.quiz[l.id]} of ${l.qs.length}</p>` : `<p class="muted">Answer, then check. Explanations appear after checking.</p>`}
    ${l.qs.map((q,n) => qBlock(q, l.id, n)).join("")}<button class="btn" id="checkBtn">Check answers</button></section>` : ""}
  <div class="lesson-foot">
    <div>${prev ? `<a class="btn quiet" href="#${prev.id}">Previous</a>` : ""}</div>
    <button class="btn ${done ? "" : "primary"}" id="doneBtn">${done ? "Mark as not done" : "Mark as done"}</button>
    <div>${next ? `<a class="btn quiet" href="#${next.id}">Next</a>` : `<a class="btn quiet" href="#practice">Practice exam</a>`}</div>
  </div>`;
}

/* ---------- practice exam ---------- */
let EX = null;
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function viewPractice(){
  if (EX && !EX.finished) return viewExam();
  if (EX && EX.finished) return viewResult();
  const hist = S.mocks.slice(-8).reverse();
  return `${geo("practice")}<h1>Practice exam</h1>
  <p class="lede">Questions are drawn at random from all lessons plus a mixed review set, timed at the real exam pace of 45 seconds per question. 85% is the pass mark.</p>
  <div class="panel"><h2>Choose a length</h2><div class="choices">
    <button class="btn" data-n="20">20 questions, 15 min</button>
    <button class="btn" data-n="40">40 questions, 30 min</button>
    <button class="btn primary" data-n="${ALL_QS.length}">Full bank, ${ALL_QS.length} questions, ${Math.round(ALL_QS.length*45/60)} min</button></div>
    <p class="muted" style="margin-top:14px">These are original practice questions, not real exam questions. Once you score 95% or more here, move on to Scrum.org’s <a href="https://www.scrum.org/open-assessments/scrum-open" target="_blank" rel="noopener">Scrum Open assessment</a>.</p></div>
  <div class="panel"><h2>Recent attempts</h2>${hist.length ? `<ul class="history">${hist.map(m => { const pc = Math.round(m.correct/m.total*100); return `<li><span>${nice(m.date)}, ${m.total} questions</span><span class="${pc >= 85 ? "pass" : "fail"}">${pc}%</span></li>`; }).join("")}</ul>` : `<p class="muted">No attempts yet. Start with 20 questions once you’ve finished a few lessons.</p>`}</div>`;
}
function startExam(n){
  const qs = shuffle(ALL_QS).slice(0, n);
  EX = { qs, ans: qs.map(() => []), flag: qs.map(() => false), cur: 0, ends: Date.now() + n*45*1000, finished: false };
  fresh = true; tick(); render();
}
function viewExam(){
  const q = EX.qs[EX.cur], multi = q.a.length > 1;
  return `<div class="exam-bar"><span class="muted">Question ${EX.cur+1} of ${EX.qs.length}</span><span class="clock" id="clock"></span></div>
  <div class="bar" style="margin-bottom:16px"><span style="width:${Math.round(EX.ans.filter(a => a.length).length/EX.qs.length*100)}%"></span></div>
  <div class="q"><p class="stem">${esc(q.q)}</p>${multi ? `<p class="hint">Choose ${q.a.length}.</p>` : ""}
  ${q.o.map((o,i) => `<label class="opt"><input type="${multi ? "checkbox" : "radio"}" name="ex" value="${i}" ${EX.ans[EX.cur].includes(i) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>
  <div class="choices"><button class="btn quiet" id="exPrev" ${EX.cur === 0 ? "disabled" : ""}>Previous</button>
  <button class="btn" id="exFlag">${EX.flag[EX.cur] ? "Remove bookmark" : "Bookmark"}</button>
  ${EX.cur < EX.qs.length-1 ? `<button class="btn primary" id="exNext">Next question</button>` : `<button class="btn primary" id="exSubmit">Submit exam</button>`}</div>
  <div class="grid-nav">${EX.qs.map((_,i) => `<button data-go="${i}" class="${EX.ans[i].length ? "answered" : ""} ${EX.flag[i] ? "flag" : ""} ${i === EX.cur ? "cur" : ""}" aria-label="Go to question ${i+1}">${i+1}</button>`).join("")}</div>
  <button class="btn quiet" id="exSubmit2">Submit now</button>`;
}
function finishExam(){
  EX.finished = true; clearInterval(tick._i);
  EX.correct = EX.qs.filter((q,i) => grade(q, EX.ans[i])).length;
  S.mocks.push({ date: today(), total: EX.qs.length, correct: EX.correct }); save();
  fresh = true; render();
  if (EX.correct / EX.qs.length >= .85) confetti(EX.correct / EX.qs.length >= .95 ? 110 : 60);
}
function viewResult(){
  const pc = Math.round(EX.correct / EX.qs.length * 100);
  const wrong = EX.qs.map((q,i) => ({q, i})).filter(o => !grade(o.q, EX.ans[o.i]));
  return `<h1>Your result</h1>
  <div class="panel"><div class="score ${pc >= 85 ? "pass" : "fail"}"><span data-count="${pc}" data-suffix="%">${pc}%</span></div><p class="muted" style="margin-top:8px">${EX.correct} of ${EX.qs.length} correct. ${pc >= 95 ? "Exam-ready pace. Confirm it with the Scrum Open assessment." : pc >= 85 ? "A pass, but aim for 95% or more before the real exam." : "Below the 85% pass mark. Review the explanations below, then reread the related lessons."}</p>
  <div class="choices"><button class="btn primary" id="again">Take another</button></div></div>
  ${wrong.length ? `<h2 style="margin:28px 0 12px">Review what you missed</h2>` + wrong.map(({q,i}) => `<div class="q"><p class="stem">${esc(q.q)}</p>${q.o.map((o,k) => `<div class="opt ${q.a.includes(k) ? "right" : EX.ans[i].includes(k) ? "wrong" : ""}"><span>${esc(o)}</span></div>`).join("")}<div class="explain">${esc(q.x)} <span class="muted">From: ${esc(q.from)}</span></div></div>`).join("") : ""}`;
}
function tick(){
  clearInterval(tick._i);
  const upd = () => {
    if (!EX || EX.finished) return clearInterval(tick._i);
    const el = $("#clock"), s = Math.max(0, Math.round((EX.ends - Date.now())/1000));
    if (el){ el.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); el.classList.toggle("low", s < 120); }
    if (s <= 0) finishExam();
  };
  upd(); tick._i = setInterval(upd, 1000);
}
function readPicked(){ return [...document.querySelectorAll('input[name="ex"]:checked')].map(i => +i.value); }

function viewSheet(){
  const rows = r => r.map(([a,b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join("");
  const table = (title, r) => `<div class="panel"><h2>${title}</h2><div class="table-wrap" style="margin-top:10px"><table><tbody>${rows(r)}</tbody></table></div></div>`;
  return `${geo("sheet")}<h1>Cheat sheet</h1><p class="lede">The facts most often tested, on one page. Reread it the night before the exam.</p>` +
  table("Timeboxes (one-month Sprint)", [["Sprint","1 month or less, fixed length"],["Sprint Planning","8 hours max"],["Daily Scrum","15 minutes, always"],["Sprint Review","4 hours max"],["Sprint Retrospective","3 hours max"]]) +
  table("Artifacts and commitments", [["Product Backlog","Product Goal"],["Sprint Backlog","Sprint Goal"],["Increment","Definition of Done"]]) +
  table("Who decides", [["Product Backlog order","Product Owner"],["Cancelling a Sprint","Product Owner, only if the Sprint Goal is obsolete"],["Sprint Goal","Whole Scrum Team"],["How much work to select","Developers, with the Product Owner"],["How the work gets done","Developers"],["Sizing backlog items","Developers"],["Sprint Backlog","Developers"],["Definition of Done","Organisation standard, or the Scrum Team"],["Establishing Scrum and team effectiveness","Scrum Master"]]) +
  table("Numbers", [["Pillars of empiricism","3: transparency, inspection, adaptation"],["Scrum Values","5: commitment, focus, openness, respect, courage"],["Events","5: the Sprint plus four inside it"],["Team size","Typically 10 or fewer"],["Exam","80 questions, 60 minutes, 85% (68) to pass"]]);
}

/* ---------- router ---------- */
let fresh = true;
function route(){ const h = location.hash.slice(1); if (h === "practice" || h === "sheet") return h; if (LESSONS.some(l => l.id === h)) return h; return "plan"; }
function render(){
  const r = route();
  renderSide(r);
  let html;
  if (r === "plan") html = viewPlan(); else if (r === "practice") html = viewPractice(); else if (r === "sheet") html = viewSheet(); else html = viewLesson(r);
  const v = $("#view");
  v.innerHTML = html + `<p class="foot">Unofficial study material. Not affiliated with or endorsed by Scrum.org. Professional Scrum Master and PSM are trademarks of Scrum.org. Lesson content is an original summary of the Scrum Guide by Ken Schwaber and Jeff Sutherland, which is licensed under CC BY-SA 4.0; always treat the <a href="https://scrumguides.org/scrum-guide.html" target="_blank" rel="noopener">official Scrum Guide</a> as the source of truth.</p>`;
  v.classList.toggle("view-enter", fresh && !calm());
  bind(r);
  countUp();
  if (r === "practice" && EX && !EX.finished) tick();
  $(".side").classList.remove("open"); $("#outlineToggle").textContent = "Show lessons";
  readProgress();
  fresh = false; animateChart = false; popId = null;
}
function readProgress(){
  const bar = $("#readProgress");
  if (!LESSONS.some(l => l.id === route())) { bar.style.width = "0"; return; }
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + "%";
}
function setStatus(act){
  if (act === "pause"){ S.status = "paused"; S.pauses.push({ from: today(), to: null }); save(); toast("Plan paused"); }
  if (act === "resume"){ const p = S.pauses[S.pauses.length-1]; if (p && !p.to) p.to = today(); S.status = "active"; save(); toast("Welcome back. Plan resumed"); }
  if (act === "complete"){ if (!confirm("Mark this plan as completed? It moves to your past plans, and your lesson progress is kept.")) return; archive("completed"); confetti(120); }
  if (act === "cancel"){ if (!confirm("Cancel your exam on " + long(S.target) + "? The plan moves to your past plans, and your lesson progress is kept.")) return; archive("cancelled"); toast("Exam cancelled"); }
  fresh = true; animateChart = true; render();
}
function bind(r){
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  on("#startBtn", "click", () => { const v = $("#setTarget").value; if (!v || diff(today(), v) < 1){ toast("Pick an exam date after today"); return; } S.start = today(); S.target = v; S.status = "active"; S.pauses = []; save(); fresh = true; animateChart = true; render(); confetti(50); });
  on("#saveDates", "click", () => { const s = $("#setStart").value, t = $("#setTarget2").value; if (!s || !t || diff(s,t) < 1){ toast("The exam date must be after the start date"); return; } S.start = s; S.target = t; save(); toast("Dates saved"); animateChart = true; render(); });
  on("#exportBtn", "click", () => { const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "psm1-progress-" + today() + ".json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });
  on("#importFile", "change", e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (typeof d !== "object" || !d.done) throw 0; S = Object.assign(blank(), d); if (S.target && !S.status) S.status = "active"; save(); applyTheme(S.theme); toast("Progress imported"); fresh = true; animateChart = true; render(); } catch(err){ toast("That file isn’t a progress export"); } }; rd.readAsText(f); });
  on("#resetBtn", "click", () => { if (confirm("Delete all progress, dates, plans and scores in this browser?")){ const theme = S.theme; S = blank(); S.theme = theme; save(); EX = null; fresh = true; render(); } });
  document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => setStatus(b.dataset.act)));
  on("#doneBtn", "click", () => {
    if (S.done[r]) { delete S.done[r]; save(); toast("Marked as not done"); render(); return; }
    S.done[r] = today(); save(); popId = r;
    const l = LESSONS.find(x => x.id === r);
    const modDone = l.module.lessons.every(x => S.done[x.id]);
    const allDone = LESSONS.every(x => S.done[x.id]);
    render();
    if (allDone){ toast("Every lesson done. Time for full mock exams"); confetti(140); }
    else if (modDone){ toast("Module complete: " + l.module.title); confetti(70); }
    else toast("Marked as done");
  });
  on("#checkBtn", "click", () => {
    const l = LESSONS.find(x => x.id === r); let score = 0;
    document.querySelectorAll(".q").forEach(box => {
      const q = l.qs[+box.dataset.i];
      const picked = [...box.querySelectorAll("input:checked")].map(i => +i.value);
      const ok = grade(q, picked); if (ok) score++;
      box.querySelectorAll(".opt").forEach((o,k) => { o.classList.remove("right","wrong"); if (q.a.includes(k)) o.classList.add("right"); else if (picked.includes(k)) o.classList.add("wrong"); });
      box.querySelector(".explain-slot").innerHTML = `<div class="explain"><b class="${ok ? "good" : "bad"}">${ok ? "Correct." : "Not quite."}</b> ${esc(q.x)}</div>`;
      box.classList.remove("shake"); if (!ok) { void box.offsetWidth; box.classList.add("shake"); }
    });
    S.quiz[r] = score; save();
    if (score === l.qs.length) { toast("All correct"); confetti(40); }
  });
  document.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => startExam(+b.dataset.n)));
  if (r === "practice" && EX && !EX.finished){
    const keep = () => { EX.ans[EX.cur] = readPicked(); };
    document.querySelectorAll('input[name="ex"]').forEach(i => i.addEventListener("change", () => { keep(); document.querySelector('.grid-nav [data-go="' + EX.cur + '"]').classList.toggle("answered", EX.ans[EX.cur].length > 0); }));
    on("#exPrev", "click", () => { keep(); EX.cur--; render(); });
    on("#exNext", "click", () => { keep(); EX.cur++; render(); });
    on("#exFlag", "click", () => { keep(); EX.flag[EX.cur] = !EX.flag[EX.cur]; render(); });
    const submit = () => { keep(); const left = EX.ans.filter(a => !a.length).length; if (left && !confirm(left + " unanswered. Submit anyway?")) return; finishExam(); };
    on("#exSubmit", "click", submit); on("#exSubmit2", "click", submit);
    document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { keep(); EX.cur = +b.dataset.go; render(); }));
  }
  on("#again", "click", () => { EX = null; fresh = true; render(); });
}
document.getElementById("appearance").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.theme = S.theme || {};
  if (b.dataset.mode) S.theme.mode = b.dataset.mode;
  if (b.dataset.accent) S.theme.accent = b.dataset.accent;
  save(); applyTheme(S.theme); renderSide(route());
});
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if ((S.theme||{}).mode === "system" || !(S.theme||{}).mode) { applyTheme(S.theme); renderSide(route()); } });
$("#outlineToggle").addEventListener("click", () => { const open = $(".side").classList.toggle("open"); $("#outlineToggle").textContent = open ? "Hide lessons" : "Show lessons"; });
window.addEventListener("hashchange", () => { fresh = true; animateChart = route() === "plan"; render(); window.scrollTo(0,0); });
window.addEventListener("scroll", readProgress, { passive: true });
render();
})();
</script>
</body>
</html>
